# .github/workflows/build.yml
#
# Rho-9 Systems, unmicro
#
# Builds standalone Linux and Windows binaries of unmicro.py, so a victim can
# run the decryptor without installing Python, and so a compiled AES backend
# ships inside it. That second point is not cosmetic: the pure-python AES
# fallback is thousands of times slower, which is the difference between
# --brute being a real option and being a theoretical one.
#
# Triggers
#   push to main     build + smoke test, artifacts kept 30 days
#   pull request     build + smoke test only
#   tag v*           build + smoke test + published GitHub Release
#   manual           Actions tab -> Build binaries -> Run workflow
#
# Supply chain: no third-party actions. Only actions/* and the gh CLI that is
# preinstalled on the runners, and every action is pinned to a commit SHA
# rather than a moving tag.

name: Build binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 is pinned deliberately, not for reproducibility but
          # for glibc. A binary linked against 2.35 runs on Ubuntu 22.04+,
          # Debian 12+ and RHEL 9+. Building on ubuntu-latest would raise the
          # floor and lock out older machines for no gain. If this label is
          # ever retired, move to the oldest Ubuntu runner still offered.
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: unmicro
          # No glibc equivalent on Windows, so newest is fine here.
          - os: windows-latest
            label: windows-x86_64
            binary: unmicro.exe

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pycryptodome only. unmicro tries the "cryptography" library first and
      # pycryptodome second, so installing just this one makes the bundled
      # backend deterministic and keeps the binary smaller.
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pycryptodome

      - name: Read version from unmicro.py
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          v=$(python - <<'PY'
          import io, re
          src = io.open("unmicro.py", encoding="utf-8").read()
          print(re.search(r'^VERSION\s*=\s*"([^"]+)"', src, re.M).group(1))
          PY
          )
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "unmicro version $v"

      # --noupx is explicit on purpose. UPX compression is one of the biggest
      # drivers of antivirus false positives, and a ransomware decryptor being
      # quarantined on a victim machine is a failure mode worth designing out.
      - name: Build binary
        run: >
          pyinstaller
          --onefile
          --console
          --clean
          --noconfirm
          --noupx
          --name unmicro
          --hidden-import Crypto.Cipher.AES
          unmicro.py

      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          test -f "$BIN"

          echo "--- version ---"
          "$BIN" --version

          echo "--- recovered operator keys survived the freeze ---"
          "$BIN" --list-keys | grep -qx "zarox"

          echo "--- a compiled AES backend is bundled ---"
          # pure-python here would mean --brute ships unusably slow, so this
          # is a hard failure, not a warning.
          mkdir -p smoke/empty
          banner=$("$BIN" --in smoke/empty --identify 2>&1 || true)
          echo "$banner"
          echo "$banner" | grep -Eq "AES back end: (pycryptodome|cryptography)"

          echo "smoke test passed"

      - name: Stage release file
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          name="unmicro-${{ steps.ver.outputs.version }}-${{ matrix.label }}"
          case "${{ matrix.binary }}" in
            *.exe) name="$name.exe" ;;
          esac
          cp "dist/${{ matrix.binary }}" "staged/$name"
          ls -l staged

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unmicro-${{ matrix.label }}
          path: staged/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write     # create the release
      actions: read       # download this run's artifacts
      id-token: write     # build provenance
      attestations: write # build provenance
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # gh run download rather than actions/download-artifact, so the upload
      # and download halves can never drift onto incompatible major versions.
      - name: Collect binaries from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ github.run_id }}" --dir staging
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          ls -l dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Lets anyone confirm the binary came out of this repo and this commit,
      # which matters when the ask is "download this exe and run it as admin".
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/unmicro-*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Free decryptor for the **Dev7 / Micro** ransomware family, the files
          renamed to `.cryptedmicro`.

          Actor: **Chattering Magpies** (R9-C001). Malware self-name: Micro.
          Family: Dev7.

          No Python needed. Download the file for your platform and run it.

          ```
          # Windows
          unmicro-windows-x86_64.exe --auto --out recovered

          # Linux
          chmod +x unmicro-linux-x86_64
          ./unmicro-linux-x86_64 --auto --out recovered
          ```

          Your encrypted files are never modified, renamed or deleted.
          Keep them until you have opened the recovered copies and are
          satisfied. Do not pay, and do not wipe the machine.

          Windows may warn that this file is unrecognised. It is unsigned.
          Check the SHA256 below and the build provenance before running it,
          and do not take an unverified copy from anywhere else.
          EOF
          {
            echo
            echo "## SHA256"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Built from \`${GITHUB_SHA}\` by GitHub Actions. Verify with:"
            echo '```'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "Rho-9 Systems. Your first line of unusual defense."
          } >> notes.md

          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "unmicro ${GITHUB_REF_NAME}" \
            --notes-file notes.md
