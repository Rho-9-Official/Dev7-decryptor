# .github/workflows/build.yml
#
# Rho-9 Systems, unmicro
#
# Builds unmicro as one executable per platform: the window (unmicro_app)
# with the decryption engine (unmicro.py) built in. Double-clicking opens the
# window; `unmicro --cli ...` runs the engine's command line. No Python
# needed, and a compiled AES back end ships inside, which is the difference
# between --brute being a real option and a theoretical one.
#
# Triggers
#   push to main     build + smoke test, artifacts kept 30 days, and if
#                    VERSION in unmicro.py has no v<VERSION> tag yet, the
#                    release job creates that tag on this commit and
#                    publishes the GitHub Release. Bumping VERSION and
#                    merging is the whole release process.
#   pull request     build + smoke test only
#   tag v*           build + smoke test + published GitHub Release (still
#                    works if a tag is pushed by hand)
#   manual           Actions tab -> Build -> Run workflow (build only,
#                    never releases)
#
# Supply chain: no third-party actions. Only actions/* and the gh CLI that is
# preinstalled on the runners, every action pinned to a commit SHA rather
# than a moving tag, and every Python package pinned by hash.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 is pinned deliberately, for glibc: a binary linked
          # against 2.35 runs on Ubuntu 22.04+, Debian 12+ and RHEL 9+.
          # Building on ubuntu-latest would raise the floor for no gain. If
          # this label is retired, move to the oldest Ubuntu runner offered.
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: unmicro
          # No glibc equivalent on Windows, so newest is fine here.
          - os: windows-latest
            label: windows-x86_64
            binary: unmicro.exe

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Exact versions and hashes come from requirements-build.txt, so a
      # changed or hijacked package on PyPI fails the build here rather than
      # landing inside an attested binary. --only-binary keeps pip from
      # running any package's own build code on the runner.
      - name: Install build dependencies
        run: >
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements-build.txt

      # The window's smoke test on Linux needs an X server and the libraries
      # Qt's xcb platform loads.
      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon-x11-0
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
          libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libfontconfig1

      # The engine's edge-case regression tests and the window's core tests.
      # The end-to-end engine tests need the license key and skip without
      # it, which CI never has.
      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Read version from unmicro.py
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          v=$(python - <<'PY'
          import io, re
          src = io.open("unmicro.py", encoding="utf-8").read()
          print(re.search(r'^VERSION\s*=\s*[\'"]([^\'"]+)[\'"]', src, re.M).group(1))
          PY
          )
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "unmicro version $v"

      - name: Icon and version info
        run: python packaging/make_assets.py

      # One windowed, single-file executable; UPX is off in the spec (it is
      # one of the biggest drivers of antivirus false positives).
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/unmicro.spec

      # The engine checks, through the same executable. --self-test needs no
      # license and reports the sealed-blob integrity digest, the AES back
      # end (compiled lib + pure-python agreement), the GCM path and the
      # bundled filetype detector. Fail the build if any of those regressed.
      - name: Smoke test the engine
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          test -f "$BIN"
          # On Windows the exe is windowed: with output redirected to a file
          # it writes there instead of opening a console window.
          "$BIN" --cli --version > version.txt 2>&1 || true
          cat version.txt
          grep -q "unmicro.py ${{ steps.ver.outputs.version }}" version.txt
          "$BIN" --cli --self-test > selftest.txt 2>&1 || true
          cat selftest.txt
          grep -qx "self-test passed" <(tr -d '\r' < selftest.txt)
          # pure-python here would mean --brute ships unusably slow
          grep -Eq "AES back end: (pycryptodome|cryptography)" selftest.txt
          grep -q "PBKDF2-SHA256 vector: OK" selftest.txt
          grep -q "AES-GCM vector: OK" selftest.txt
          grep -Eq "Type detection: filetype " selftest.txt
          echo "engine smoke test passed"

      - name: Smoke test the window (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export UNMICRO_GUI_TEST_HOOK="$PWD/packaging/smoke_hook.py"
          for ui in qt tk; do
            export SMOKE_OUT="$PWD/smoke-$ui.txt"
            timeout 120 xvfb-run -a dist/unmicro --$ui
            cat "$SMOKE_OUT"
            grep -q "engine='built-in'" "$SMOKE_OUT"
          done

      # Both windows open and close; the hidden console the window gives the
      # engine (so its pause menu and Ctrl+C work) runs the built-in engine.
      - name: Smoke test the window and the console helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\unmicro.exe).Path
          $env:UNMICRO_GUI_TEST_HOOK = (Resolve-Path packaging\smoke_hook.py).Path
          foreach ($ui in 'qt', 'tk') {
            $env:SMOKE_OUT = Join-Path $PWD "smoke-$ui.txt"
            $p = Start-Process $exe -ArgumentList "--$ui" -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "$ui window did not close" }
            if (-not (Test-Path $env:SMOKE_OUT)) { throw "$ui window did not start" }
            $out = Get-Content $env:SMOKE_OUT -Raw
            $out
            if ($out -notmatch "engine='built-in'") { throw "$ui window did not pick the built-in engine" }
          }
          Start-Process $exe -ArgumentList '--console-host', $exe, '--engine', '--version' -RedirectStandardOutput helper.txt -Wait
          $out = Get-Content helper.txt -Raw
          $out
          if ($out -notmatch 'unmicro\.py') { throw "console helper did not run the engine: $out" }
          'window and console helper smoke test passed'

      - name: Stage release file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          name="unmicro-${{ steps.ver.outputs.version }}-${{ matrix.label }}"
          case "${{ matrix.binary }}" in
            *.exe) name="$name.exe" ;;
          esac
          cp "dist/${{ matrix.binary }}" "staged/$name"
          ls -l staged

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unmicro-${{ matrix.label }}
          path: staged/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write     # create the tag and the release
      actions: read       # download this run's artifacts
      id-token: write     # build provenance
      attestations: write # build provenance
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Works out which tag this run releases, or decides there is nothing
      # to release.
      #   tag push:  the pushed tag, always released.
      #   main push: v<VERSION> from unmicro.py, released only if that tag
      #              does not exist yet.
      # The tag created here comes from GITHUB_TOKEN, which GitHub does not
      # let start another workflow run, so there is no duplicate release run.
      - name: Decide release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag push, releasing ${GITHUB_REF_NAME}"
            exit 0
          fi
          v=$(python3 - <<'PY'
          import io, re
          src = io.open("unmicro.py", encoding="utf-8").read()
          print(re.search(r'^VERSION\s*=\s*[\'"]([^\'"]+)[\'"]', src, re.M).group(1))
          PY
          )
          tag="v${v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${tag} already exists, nothing to release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "${tag} does not exist yet, releasing it from ${GITHUB_SHA}"
          fi

      # gh run download rather than actions/download-artifact, so the upload
      # and download halves can never drift onto incompatible major versions.
      - name: Collect binaries from this run
        if: steps.tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ github.run_id }}" --dir staging
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          ls -l dist

      - name: Checksums
        if: steps.tag.outputs.release == 'true'
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Lets anyone confirm the binary came out of this repo and this commit,
      # which matters when the ask is "download this exe and run it".
      - name: Attest build provenance
        if: steps.tag.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/unmicro-*

      - name: Publish
        if: steps.tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The release notes name the exact files uploaded, read from dist/
          # rather than typed in, so they always carry the version number.
          WIN=$(cd dist && ls unmicro-*-windows-x86_64.exe)
          LIN=$(cd dist && ls unmicro-*-linux-x86_64)
          cat > notes.md <<'EOF'
          Free decryptor for the **Dev7 / Micro** ransomware family, the files
          renamed to `.cryptedmicro`.

          > **Warning: this release is experimental and may contain bugs.**
          > Linux (x86_64) and Windows 10 (64-bit) were both tested end to end,
          > with no Python installed;
          > other systems are expected to work but have not been tested. Your
          > encrypted files are only ever read, never changed. Report problems
          > to recon@rho-9.com.

          Actor: **Chattering Magpies** (R9-C001). Malware self-name: Micro.
          Family: Dev7.

          No Python needed. Download the file for your platform and open it:
          a window walks you through choosing the files, entering your license
          key, searching for the key and saving the recovered copies.

          - **Windows:** double-click `__WIN__`.
          - **Linux:** `chmod +x __LIN__`, then run `./__LIN__`.

          The command line is built in too, for responders and scripts:
          `__WIN__ --cli --auto --out recovered` (it opens its own console
          window), or `./__LIN__ --cli --auto --out recovered`.

          You need a license key: paste it on the Keys tab (or pass `--license`
          on the command line). If you do not have one, or yours is not
          accepted, email **recon@rho-9.com** and mention "Chattering Magpies".
          Rho-9 sends one back once your case is confirmed.

          Your encrypted files are never modified, renamed or deleted.
          Keep them until you have opened the recovered copies and are
          satisfied. Do not pay, and do not wipe the machine.

          Windows may warn that this file is unrecognised. It is unsigned.
          Check the SHA256 below and the build provenance before running it,
          and do not take an unverified copy from anywhere else.
          EOF
          sed -i "s/__WIN__/${WIN}/g; s/__LIN__/${LIN}/g" notes.md
          if grep -q "__WIN__\|__LIN__" notes.md; then
            echo "release notes still have a placeholder" >&2
            exit 1
          fi
          {
            echo
            echo "## SHA256"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Built from \`${GITHUB_SHA}\` by GitHub Actions. Verify with:"
            echo '```'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "Rho-9 Systems. Your first line of unusual defense."
          } >> notes.md

          gh release create "${TAG}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "unmicro ${TAG}" \
            --notes-file notes.md
