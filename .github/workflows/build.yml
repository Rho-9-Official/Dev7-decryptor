# .github/workflows/build.yml
#
# Rho-9 Systems, unmicro
#
# Builds standalone Linux and Windows binaries of unmicro.py, so a victim can
# run the decryptor without installing Python, and so a compiled AES backend
# ships inside it. That second point is not cosmetic: the pure-python AES
# fallback is thousands of times slower, which is the difference between
# --brute being a real option and being a theoretical one.
#
# Triggers
#   push to main     build + smoke test, artifacts kept 30 days, and if
#                    VERSION in unmicro.py has no v<VERSION> tag yet, the
#                    release job creates that tag on this commit and
#                    publishes the GitHub Release. Bumping VERSION and
#                    merging is the whole release process.
#   pull request     build + smoke test only
#   tag v*           build + smoke test + published GitHub Release (still
#                    works if a tag is pushed by hand)
#   manual           Actions tab -> Build binaries -> Run workflow (build
#                    only, never releases)
#
# Supply chain: no third-party actions. Only actions/* and the gh CLI that is
# preinstalled on the runners, and every action is pinned to a commit SHA
# rather than a moving tag.

name: Build binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 is pinned deliberately, not for reproducibility but
          # for glibc. A binary linked against 2.35 runs on Ubuntu 22.04+,
          # Debian 12+ and RHEL 9+. Building on ubuntu-latest would raise the
          # floor and lock out older machines for no gain. If this label is
          # ever retired, move to the oldest Ubuntu runner still offered.
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: unmicro
          # No glibc equivalent on Windows, so newest is fine here.
          - os: windows-latest
            label: windows-x86_64
            binary: unmicro.exe

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pycryptodome for the AES backend (unmicro tries "cryptography" first and
      # pycryptodome second, so installing just this one keeps the bundled
      # backend deterministic and the binary smaller), and filetype for the
      # extension-repair detector. filetype is pure Python with no sub-deps, so
      # it adds almost nothing to the binary.
      #
      # Exact versions and hashes come from requirements-build.txt, so a
      # changed or hijacked package on PyPI fails the build here rather than
      # landing inside an attested binary. --only-binary keeps pip from
      # running any package's own build code on the runner. pip itself is
      # no longer upgraded, since that would pull an unpinned pip in before
      # the hash check.
      - name: Install build dependencies
        run: >
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements-build.txt

      # Edge-case regression tests. The end-to-end ones need the license key
      # and skip without it, which CI never has; the rest build their own
      # fixtures with the pinned pycryptodome installed above.
      - name: Regression tests
        run: python -m unittest discover -s tests -v

      - name: Read version from unmicro.py
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          v=$(python - <<'PY'
          import io, re
          src = io.open("unmicro.py", encoding="utf-8").read()
          print(re.search(r'^VERSION\s*=\s*[\'"]([^\'"]+)[\'"]', src, re.M).group(1))
          PY
          )
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "unmicro version $v"

      # --noupx is explicit on purpose. UPX compression is one of the biggest
      # drivers of antivirus false positives, and a ransomware decryptor being
      # quarantined on a victim machine is a failure mode worth designing out.
      - name: Build binary
        run: >
          pyinstaller
          --onefile
          --console
          --clean
          --noconfirm
          --noupx
          --name unmicro
          --hidden-import Crypto.Cipher.AES
          --collect-submodules filetype
          unmicro.py

      - name: Smoke test the binary
        shell: bash
        # The smoke test never has the real license key. Every check here
        # runs against things that are available without unlocking the
        # sealed blobs. --self-test reports all three at once: the
        # sealed-blob integrity digest (SHA-256 over the ciphertext
        # bytes), the AES back end check (compiled lib + pure-python
        # agreement on a random vector) and the bundled filetype
        # detector. Fail the build if any of those regressed.
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          test -f "$BIN"

          echo "--- version ---"
          "$BIN" --version

          echo "--- self-test ---"
          out=$("$BIN" --self-test)
          echo "$out"
          echo "$out" | grep -qx "self-test passed"

          echo "--- a compiled AES backend is bundled ---"
          # pure-python here would mean --brute ships unusably slow, so
          # this is a hard failure, not a warning.
          echo "$out" | grep -Eq "AES back end: (pycryptodome|cryptography)"

          echo "--- the AES-GCM path (newer .cryptedmicro format) works ---"
          # PBKDF2 and GCM known-answer vectors on the bundled back end and
          # on the built-in one, including a corrupted tag being rejected.
          echo "$out" | grep -q "PBKDF2-SHA256 vector: OK"
          echo "$out" | grep -q "AES-GCM vector: OK"

          echo "--- the filetype detector is bundled for extension repair ---"
          # A missing filetype would silently fall back to the built-in
          # table on a real run. --self-test prints the detector it
          # found so the build fails here if filetype did not make it
          # into the binary.
          echo "$out" | grep -Eq "Type detection: filetype "

          echo "smoke test passed"

      - name: Stage release file
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          name="unmicro-${{ steps.ver.outputs.version }}-${{ matrix.label }}"
          case "${{ matrix.binary }}" in
            *.exe) name="$name.exe" ;;
          esac
          cp "dist/${{ matrix.binary }}" "staged/$name"
          ls -l staged

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unmicro-${{ matrix.label }}
          path: staged/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write     # create the tag and the release
      actions: read       # download this run's artifacts
      id-token: write     # build provenance
      attestations: write # build provenance
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Works out which tag this run releases, or decides there is nothing
      # to release.
      #   tag push:  the pushed tag, always released.
      #   main push: v<VERSION> from unmicro.py, released only if that tag
      #              does not exist yet. If it exists, that version already
      #              went out (or a hand-pushed tag run owns it), so this
      #              run stops after the build and does not touch it.
      # The tag created here comes from GITHUB_TOKEN, which GitHub does not
      # let start another workflow run, so there is no second, duplicate
      # release run off the back of it.
      - name: Decide release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag push, releasing ${GITHUB_REF_NAME}"
            exit 0
          fi
          v=$(python3 - <<'PY'
          import io, re
          src = io.open("unmicro.py", encoding="utf-8").read()
          print(re.search(r'^VERSION\s*=\s*[\'"]([^\'"]+)[\'"]', src, re.M).group(1))
          PY
          )
          tag="v${v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${tag} already exists, nothing to release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "${tag} does not exist yet, releasing it from ${GITHUB_SHA}"
          fi

      # gh run download rather than actions/download-artifact, so the upload
      # and download halves can never drift onto incompatible major versions.
      - name: Collect binaries from this run
        if: steps.tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ github.run_id }}" --dir staging
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          ls -l dist

      - name: Checksums
        if: steps.tag.outputs.release == 'true'
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Lets anyone confirm the binary came out of this repo and this commit,
      # which matters when the ask is "download this exe and run it as admin".
      - name: Attest build provenance
        if: steps.tag.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/unmicro-*

      # --target only matters on a main push, where the tag does not exist
      # yet and gh creates it on this exact commit. On a tag push the tag
      # already exists and --target is ignored.
      - name: Publish
        if: steps.tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The release notes name the exact files uploaded, read from dist/
          # rather than typed in, so they always carry the version number.
          WIN=$(cd dist && ls unmicro-*-windows-x86_64.exe)
          LIN=$(cd dist && ls unmicro-*-linux-x86_64)
          cat > notes.md <<'EOF'
          Free decryptor for the **Dev7 / Micro** ransomware family, the files
          renamed to `.cryptedmicro`.

          Actor: **Chattering Magpies** (R9-C001). Malware self-name: Micro.
          Family: Dev7.

          No Python needed. Download the file for your platform and run it.

          ```
          # Windows
          __WIN__ --auto --out recovered

          # Linux
          chmod +x __LIN__
          ./__LIN__ --auto --out recovered
          ```

          From 3.7 on, each build needs its own license key. Pass it with
          `--license KEY`, set `UNMICRO_LICENSE`, or enter it when prompted.
          If you do not have a key for this build, email **recon@rho-9.com**
          and mention "Chattering Magpies". Rho-9 sends one back once your
          case is confirmed. Keys from earlier builds will not work here.

          Your encrypted files are never modified, renamed or deleted.
          Keep them until you have opened the recovered copies and are
          satisfied. Do not pay, and do not wipe the machine.

          Windows may warn that this file is unrecognised. It is unsigned.
          Check the SHA256 below and the build provenance before running it,
          and do not take an unverified copy from anywhere else.
          EOF
          sed -i "s/__WIN__/${WIN}/g; s/__LIN__/${LIN}/g" notes.md
          if grep -q "__WIN__\|__LIN__" notes.md; then
            echo "release notes still have a placeholder" >&2
            exit 1
          fi
          {
            echo
            echo "## SHA256"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Built from \`${GITHUB_SHA}\` by GitHub Actions. Verify with:"
            echo '```'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "Rho-9 Systems. Your first line of unusual defense."
          } >> notes.md

          gh release create "${TAG}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "unmicro ${TAG}" \
            --notes-file notes.md
